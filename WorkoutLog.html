<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftLog">
<title>Angel's Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — sticky date header, scrolling session card stack, fixed bottom tab bar. Deliberately dark-only (gym use). */
:root{
  --bg:#0b0f14; --panel:#131a22; --panel-2:#1a232d; --line:#25313d;
  --fg:#e8eef3; --muted:#8696a5; --accent:#2fd6b5; --accent-ink:#04201a;
  --flame:#ff9a3c; --miss:#e5636b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--accent)}
.streak{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 9px;font-weight:600;font-variant-numeric:tabular-nums}
.streak svg{width:16px;height:16px;fill:var(--muted)}
.streak.hot svg{fill:var(--flame)}
.streak.hot{border-color:color-mix(in srgb,var(--flame) 45%,var(--line))}
.datebar{display:flex;align-items:center;gap:8px;margin-top:12px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:2}
.datelabel{flex:1;min-width:0;text-align:center}
.datelabel b{display:block;font-family:var(--display);font-size:20px;letter-spacing:.02em}
.datelabel small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
main{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.sessionhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sessionhead h2{margin:4px 0 2px;font-family:var(--display);font-size:30px;line-height:1;letter-spacing:.01em;text-transform:uppercase}
.sessionhead p{margin:0;color:var(--muted);font-size:13px}
select.pick{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:46%}
.donebadge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.ex{padding:12px 14px}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exhead h3{margin:0;font-size:16px;font-weight:600;min-width:0}
.exhead .tgt{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.exmeta{color:var(--muted);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.exmeta em{font-style:normal;color:var(--accent)}
.sets{display:grid;gap:6px;margin-top:10px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.setrow .n{color:var(--muted);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.setrow input{width:100%;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;font-variant-numeric:tabular-nums;text-align:center}
.setrow input::placeholder{color:#55636f}
.colhead{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;text-align:center;margin-top:10px}
.chk{width:44px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center}
.chk svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:3}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on svg{stroke:var(--accent-ink)}
.setrow.on input{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.habits{display:grid;gap:8px}
.habit{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.habit .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.habit.on .box{background:var(--accent);border-color:var(--accent)}
.habit.on .box::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.habit span{min-width:0}
.habit small{display:block;color:var(--muted);font-size:12px}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.feel button{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.feel b{font-family:var(--display);font-size:20px}
.feel small{font-size:11px;color:var(--muted)}
.feel button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.feel button.on small{color:var(--accent-ink)}
textarea{width:100%;margin-top:10px;min-height:96px;resize:vertical;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.finish{width:100%;border:0;border-radius:var(--r);padding:16px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:22px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.finish.undo{background:var(--panel);color:var(--muted);border:1px solid var(--line);font-size:16px}
.rest h2{margin:4px 0 6px;font-family:var(--display);font-size:30px;text-transform:uppercase}
.rest p{margin:0;color:var(--muted)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead h2{margin:0;font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat.flame b{color:var(--flame)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.dow{font-size:10px;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.day{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--panel-2);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-size:14px;position:relative}
.day.blank{background:transparent}
.day.done{background:var(--accent);color:var(--accent-ink);font-weight:700}
.day.today{border-color:var(--fg)}
.day .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.day.missed .dot{background:var(--miss)}
.day.future{color:#5b6874}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.list{display:grid;gap:6px;margin-top:8px}
.logrow{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--panel-2);border-radius:10px;width:100%;border:0;text-align:left}
.logrow span:last-child{color:var(--muted);font-size:13px;white-space:nowrap}
/* lifts */
.lift{display:grid;gap:8px}
.lift .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lift h3{margin:0;font-size:16px}
.lift .big{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.lift .big small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:4px}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.lift .sub{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
td:not(:first-child),th:not(:first-child){text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}
.backup{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.backup button,.backup label{flex:1;min-width:130px;text-align:center;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-weight:600;cursor:pointer}
.empty{color:var(--muted);font-size:14px;margin:8px 0 0}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav.tabs button{background:none;border:0;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
nav.tabs button.on{color:var(--accent);background:var(--panel)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--flame);color:var(--fg);padding:12px 16px;border-radius:12px;display:flex;align-items:center;gap:10px;z-index:9;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast svg{width:22px;height:22px;fill:var(--flame);flex:none}
.sync{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
@media (prefers-reduced-motion:no-preference){.chk,.feel button,.habit,.day{transition:background .15s,border-color .15s}.toast{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="toprow">
      <div class="brand">Lift<span>Log</span></div>
      <div class="streak" id="streakChip" title="Current streak (weekdays)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2s.7 3.2-1.6 6c-1.5 1.8-3.9 3.3-3.9 6.6A5.9 5.9 0 0 0 14 20.5a6.3 6.3 0 0 0 6-6.4c0-3.7-2.4-5.6-3.3-8.1-.3 1.6-1 2.7-2 3.3.4-3.4-1.2-6-1.2-7.3z"/></svg>
        <span id="streakNum">0</span>
      </div>
    </div>
    <div class="datebar" id="datebar">
      <button class="iconbtn" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="datelabel"><b id="dateMain"></b><small id="dateSub"></small></div>
      <button class="iconbtn" id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>
  <main id="app"></main>
  <p class="sync" id="sync">Loading your log…</p>
</div>

<nav class="tabs">
  <div class="in">
    <button id="tab-today" class="on"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Today</button>
    <button id="tab-cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>
    <button id="tab-lifts"><svg viewBox="0 0 24 24"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg>Lifts</button>
  </div>
</nav>
<div id="toastHost"></div>

<script>
const PLAN=[
 {name:"Upper",tag:"Strength · heavy bench",after:"Run intervals",ex:[
  ["Bench press",4,"4–6","3 min",160],["Chest-supported or barbell row",4,"6–8","2 min"],["Seated DB shoulder press",3,"8–10","2 min"],
  ["Band-assisted pullups",3,"5–8","2 min"],["Lateral raise",3,"12–15","60 s"],["Rope triceps pushdown",3,"12","60 s"],["Hammer curl",3,"10–12","60 s"]]},
 {name:"Lower",tag:"Strength · heavy squat",after:"Splits stretching",ex:[
  ["Back squat (full depth)",4,"4–6","3 min",180],["Romanian deadlift",3,"8","2 min",155],["Bulgarian split squat",3,"8/leg","90 s"],
  ["Leg extension",3,"12–15","60 s"],["Hip adductor + abductor machine",2,"15 each","60 s"],["Standing cable hip flexion",3,"12/leg","45 s"],["Tibialis raise",3,"20","45 s"]]},
 {name:"Push",tag:"Volume · shoulders and pushups",after:"Run intervals",ex:[
  ["Incline DB press",4,"8–10","2 min"],["Standing barbell overhead press",3,"6–8","2 min"],["Close-grip bench or assisted dips",3,"8–10","90 s"],
  ["Cable or pec deck fly",3,"12–15","60 s"],["Lateral raise",4,"12–15","60 s"],["Overhead cable triceps extension",3,"12","60 s"],["Pushups",3,"70% max","90 s"]]},
 {name:"Pull",tag:"Volume · back and pullups",after:"Easy run",ex:[
  ["Pullup negatives (5 s down)",4,"3–5","2 min"],["Lat pulldown",3,"10–12","90 s"],["Seated cable row",3,"10–12","90 s"],["Face pull",3,"15","60 s"],
  ["Rear delt fly",3,"15","60 s"],["DB shrug",3,"12","60 s"],["Barbell or EZ curl",3,"10","60 s"],["Reverse curl",2,"12–15","60 s"]]},
 {name:"Legs",tag:"Hinge · heavy hex bar",after:"Splits stretching",ex:[
  ["Hex bar deadlift",4,"4–6","3 min",265],["Front squat or leg press",3,"8–10","2 min"],["Hip thrust",3,"10","90 s"],["Walking lunges",2,"10/leg","90 s"],
  ["Leg curl",3,"12","60 s"],["45° back extension",3,"12–15","60 s"],["Copenhagen plank",2,"20–30 s/side","45 s"],["Farmer's carry (hex bar)",3,"40 yd","90 s"]]}
];
const GOALS=[["Bench press",315],["Back squat (full depth)",400,"Squat"],["Hex bar deadlift",500,"Hex bar deadlift"]];
const HABITS=[["gtg","Pushups — grease the groove","5–6 sets of 7 through the day"],["splits","Splits — 10 min","Front both sides, side split, couch, pigeon"],["steps","10k steps",""]];
const FEELS=[[1,"Drained"],[2,"Low"],[3,"OK"],[4,"Good"],[5,"Strong"]];
const LS="liftlog.v1";

const state={logs:{},view:"today",date:todayKey(),calMonth:null,touched:new Set(),dbRef:null,uid:null,mode:"local"};

function todayKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseKey(k){const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return todayKey(d)}
function isWeekday(k){const w=parseKey(k).getDay();return w>=1&&w<=5}
function defaultSession(k){const w=parseKey(k).getDay();return w>=1&&w<=5?w-1:null}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function getLog(k){return state.logs[k]||null}
function ensureLog(k){if(!state.logs[k]){state.logs[k]={date:k,session:defaultSession(k),sets:{},habits:{},after:false,feel:null,notes:"",done:false}}return state.logs[k]}
function sessionOf(k){const l=getLog(k);if(l&&l.session!==undefined)return l.session;return defaultSession(k)}

/* ---------- streaks ---------- */
function isDone(k){const l=getLog(k);return !!(l&&l.done)}
function currentStreak(){
  let k=todayKey(),n=0,first=true;
  for(let i=0;i<800;i++){
    if(isDone(k))n++;
    else if(!isWeekday(k)||first){}
    else break;
    first=false;k=addDays(k,-1);
  }
  return n;
}
function bestStreak(){
  const keys=Object.keys(state.logs).filter(isDone).sort();if(!keys.length)return 0;
  let k=keys[0],end=todayKey(),run=0,best=0;
  while(k<=end){if(isDone(k)){run++;best=Math.max(best,run)}else if(isWeekday(k)&&k!==end){run=0}k=addDays(k,1)}
  return best;
}

/* ---------- history helpers ---------- */
function setsFor(log,exName){return(log&&log.sets&&log.sets[exName])||[]}
function topWeight(sets){let m=null;for(const s of sets){const w=parseFloat(s.w);if(!isNaN(w)&&(m===null||w>m))m=w}return m}
function lastPerf(exName,beforeKey){
  const keys=Object.keys(state.logs).filter(k=>k<beforeKey).sort().reverse();
  for(const k of keys){const s=setsFor(state.logs[k],exName).filter(x=>x.w!==""&&x.w!=null);if(s.length){return{date:k,top:topWeight(s),reps:s.find(x=>parseFloat(x.w)===topWeight(s))?.r||""}}}
  return null;
}
function bestPerf(exName){let best=null;for(const k in state.logs){const t=topWeight(setsFor(state.logs[k],exName));if(t!==null&&(!best||t>best.top))best={top:t,date:k}}return best}

/* ---------- persistence ---------- */
function cacheLocal(){try{localStorage.setItem(LS,JSON.stringify(state.logs))}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(LS);if(r)state.logs=JSON.parse(r)||{}}catch(e){}}
const timers={},inflight={},dirty={};
function save(k){
  state.touched.add(k);cacheLocal();
  if(state.mode!=="db")return;
  clearTimeout(timers[k]);timers[k]=setTimeout(()=>flush(k),600);
}
async function flush(k){
  if(inflight[k]){dirty[k]=true;return}
  inflight[k]=true;setSync("Saving…");
  try{await state.dbRef.doc(k).set(JSON.parse(JSON.stringify(state.logs[k])));setSync("Saved to your account")}
  catch(e){
    if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await state.dbRef.doc(k).set(JSON.parse(JSON.stringify(state.logs[k])));setSync("Saved to your account")}catch(e2){setSync("Couldn't save — kept on this phone. It will retry on your next change.")}}
    else if(e&&e.code==="quota_exceeded"){setSync("Storage is full — delete old entries to keep saving.")}
    else setSync("Couldn't save — kept on this phone. It will retry on your next change.");
  }
  inflight[k]=false;if(dirty[k]){dirty[k]=false;flush(k)}
}
function setSync(t){document.getElementById("sync").textContent=t}

async function initDb(){
  if(!window.claude||!window.claude.use){setSync("Saved on this phone only");return}
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid){setSync("Saved on this phone only — sign in to sync");return}
    state.uid=uid;state.dbRef=db.collection("data/users/"+uid);state.mode="db";
    let first=true;
    state.dbRef.onSnapshot(snap=>{
      for(const ch of snap.docChanges()){
        const k=ch.doc.id;
        if(ch.type==="removed"){if(!state.touched.has(k))delete state.logs[k];continue}
        if(state.touched.has(k))continue;
        state.logs[k]=JSON.parse(JSON.stringify(ch.doc.data()));
      }
      if(first){
        first=false;
        // push anything cached on this phone that the account doesn't have yet
        const remote=new Set(snap.docs.map(d=>d.id));
        for(const k in state.logs){if(!remote.has(k)){state.touched.add(k);flush(k)}}
        setSync("Synced to your account");
      }
      cacheLocal();
      const a=document.activeElement;
      if(!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")))render();
      else renderStreak();
    },err=>{setSync("Sync paused — changes are kept on this phone")});
  }catch(e){setSync("Saved on this phone only")}
}

/* ---------- rendering ---------- */
const app=document.getElementById("app");
function fmtDate(k){const d=parseKey(k);return d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}
function renderStreak(){
  const n=currentStreak();document.getElementById("streakNum").textContent=n;
  document.getElementById("streakChip").classList.toggle("hot",n>=2);
}
function render(){
  renderStreak();
  document.getElementById("datebar").hidden=state.view!=="today";
  for(const t of ["today","cal","lifts"])document.getElementById("tab-"+t).classList.toggle("on",state.view===t);
  if(state.view==="today")renderToday();else if(state.view==="cal")renderCal();else renderLifts();
}

function renderToday(){
  const k=state.date,log=getLog(k),si=sessionOf(k),t=todayKey();
  document.getElementById("dateMain").textContent=k===t?"Today":fmtDate(k);
  document.getElementById("dateSub").textContent=k===t?fmtDate(k):(k<t?"Past day":"Upcoming");
  const opts=`<option value="-1"${si===null?" selected":""}>Rest day</option>`+PLAN.map((p,i)=>`<option value="${i}"${si===i?" selected":""}>${p.name}</option>`).join("");
  let h="";
  if(si===null){
    h+=`<section class="card rest"><div class="sessionhead"><div><div class="label">Weekend</div><h2>Recovery</h2></div><select class="pick" id="pick" aria-label="Session">${opts}</select></div>
      <p>Basketball, steps and stretching. Pick a session above if you train today.</p>${log&&log.done?`<span class="donebadge">Logged</span>`:""}</section>`;
  }else{
    const p=PLAN[si];
    h+=`<section class="card"><div class="sessionhead"><div><div class="label">${p.tag}</div><h2>${p.name}</h2><p>${p.ex.length} exercises · after: ${p.after}</p></div><select class="pick" id="pick" aria-label="Session">${opts}</select></div>
      ${log&&log.done?`<span class="donebadge">Workout complete</span>`:""}</section>`;
    p.ex.forEach(([name,sets,reps,rest,start],ei)=>{
      const cur=setsFor(log,name),last=lastPerf(name,k);
      const ph=last&&last.top!==null?last.top:(start||"");
      const meta=last&&last.top!==null?`Last: <em>${last.top} lb${last.reps?" × "+esc(last.reps):""}</em> · ${parseKey(last.date).toLocaleDateString(undefined,{month:"short",day:"numeric"})}`:(start?`Start: <em>${start} lb</em>`:`Rest ${rest}`);
      h+=`<section class="card ex"><div class="exhead"><h3>${esc(name)}</h3><span class="tgt">${sets} × ${reps}</span></div>
        <div class="exmeta">${meta}${last||start?` · rest ${rest}`:""}</div>
        <div class="colhead"><span>Set</span><span>lb</span><span>Reps</span><span>Done</span></div><div class="sets">`;
      for(let s=0;s<sets;s++){
        const v=cur[s]||{};
        h+=`<div class="setrow${v.ok?" on":""}"><span class="n">${s+1}</span>
          <input id="w-${ei}-${s}" inputmode="decimal" placeholder="${esc(ph)}" value="${esc(v.w??"")}" data-ex="${esc(name)}" data-s="${s}" data-f="w" aria-label="${esc(name)} set ${s+1} weight">
          <input id="r-${ei}-${s}" inputmode="text" placeholder="${esc(reps)}" value="${esc(v.r??"")}" data-ex="${esc(name)}" data-s="${s}" data-f="r" aria-label="${esc(name)} set ${s+1} reps">
          <button class="chk${v.ok?" on":""}" data-ex="${esc(name)}" data-s="${s}" data-act="set" data-ph="${esc(ph)}" data-rp="${esc(reps)}" aria-label="Mark set ${s+1} done" aria-pressed="${!!v.ok}"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>`;
      }
      h+=`</div></section>`;
    });
    h+=`<section class="card"><div class="label">After lifting</div><div class="habits" style="margin-top:10px">
      <button class="habit${log&&log.after?" on":""}" data-act="after"><span class="box"></span><span>${p.after}</span></button></div></section>`;
  }
  const hb=(log&&log.habits)||{};
  h+=`<section class="card"><div class="label">Daily</div><div class="habits" style="margin-top:10px">`+HABITS.map(([id,t,s])=>`<button class="habit${hb[id]?" on":""}" data-act="habit" data-id="${id}"><span class="box"></span><span>${t}${s?`<small>${s}</small>`:""}</span></button>`).join("")+`</div></section>`;
  h+=`<section class="card"><div class="label">How do you feel?</div><div class="feel">`+FEELS.map(([v,t])=>`<button data-act="feel" data-v="${v}" class="${log&&log.feel===v?"on":""}" aria-pressed="${log&&log.feel===v}"><b>${v}</b><small>${t}</small></button>`).join("")+`</div>
    <textarea id="notes" placeholder="Energy, sleep, pumps, anything that hurt, what to change next time…">${esc(log?log.notes:"")}</textarea></section>`;
  h+=log&&log.done?`<button class="finish undo" data-act="finish">Mark as not done</button>`:`<button class="finish" data-act="finish">Finish workout</button>`;
  app.innerHTML=h;
}

function renderCal(){
  const t=todayKey();
  if(!state.calMonth){const d=parseKey(t);state.calMonth=[d.getFullYear(),d.getMonth()]}
  const [y,m]=state.calMonth,first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()+6)%7;
  let doneMonth=0;for(let d=1;d<=days;d++){if(isDone(todayKey(new Date(y,m,d))))doneMonth++}
  let h=`<div class="stats"><div class="stat flame"><div class="label">Streak</div><b>${currentStreak()}</b></div><div class="stat"><div class="label">Best</div><b>${bestStreak()}</b></div><div class="stat"><div class="label">This month</div><b>${doneMonth}</b></div></div>`;
  h+=`<section class="card"><div class="calhead"><button class="iconbtn" data-act="mprev" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h2>${first.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2>
    <button class="iconbtn" data-act="mnext" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div><div class="grid7">`;
  for(const d of ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"])h+=`<div class="dow">${d}</div>`;
  for(let i=0;i<lead;i++)h+=`<div class="day blank"></div>`;
  for(let d=1;d<=days;d++){
    const k=todayKey(new Date(y,m,d));
    const cls=["day"];if(isDone(k))cls.push("done");else if(k<t&&isWeekday(k))cls.push("missed");if(k===t)cls.push("today");if(k>t)cls.push("future");
    h+=`<button class="${cls.join(" ")}" data-act="openday" data-k="${k}" aria-label="${fmtDate(k)}${isDone(k)?", worked out":""}">${d}<span class="dot"></span></button>`;
  }
  h+=`</div><div class="legend"><span><i style="background:var(--accent)"></i>Worked out</span><span><i style="background:var(--miss);border-radius:50%"></i>Missed weekday</span><span><i style="border:1px solid var(--fg)"></i>Today</span></div></section>`;
  const recent=Object.keys(state.logs).filter(isDone).sort().reverse().slice(0,8);
  h+=`<section class="card"><div class="label">Recent workouts</div>`;
  if(!recent.length)h+=`<p class="empty">Nothing logged yet. Finish a workout on the Today tab and it shows up here.</p>`;
  else h+=`<div class="list">`+recent.map(k=>{const l=state.logs[k],s=l.session;const f=FEELS.find(x=>x[0]===l.feel);return`<button class="logrow" data-act="openday" data-k="${k}"><span>${s===null||s===undefined?"Rest day":PLAN[s].name} · ${parseKey(k).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</span><span>${f?f[1]:""}</span></button>`}).join("")+`</div>`;
  h+=`</section>`;
  app.innerHTML=h;
}

function renderLifts(){
  let h=`<section class="card"><div class="label">Goal lifts</div><div style="display:grid;gap:18px;margin-top:12px">`;
  for(const [name,goal,label] of GOALS){
    const b=bestPerf(name),start=PLAN.flatMap(p=>p.ex).find(e=>e[0]===name)[4];
    const v=b?b.top:null,pct=Math.min(100,Math.round(((v||0)/goal)*100));
    h+=`<div class="lift"><div class="row"><h3>${label||name}</h3><div class="big">${v!==null?v:"—"}<small>/ ${goal} lb</small></div></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="sub"><span>${v!==null?"Best top set · "+parseKey(b.date).toLocaleDateString(undefined,{month:"short",day:"numeric"}):"Start at "+start+" lb"}</span><span>${pct}%</span></div></div>`;
  }
  h+=`</div></section>`;
  const rows=[];const seen=new Set();
  PLAN.forEach(p=>p.ex.forEach(e=>{if(seen.has(e[0]))return;seen.add(e[0]);const b=bestPerf(e[0]);if(b){const l=lastPerf(e[0],"9999");rows.push([e[0],b.top,l?l.top:null])}}));
  h+=`<section class="card"><div class="label">All exercises</div>`;
  if(!rows.length)h+=`<p class="empty">Log weights on the Today tab and your best and most recent top sets show up here.</p>`;
  else h+=`<div class="tablewrap"><table><thead><tr><th>Exercise</th><th>Last</th><th>Best</th></tr></thead><tbody>`+rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${r[2]??"—"}</td><td>${r[1]}</td></tr>`).join("")+`</tbody></table></div>`;
  h+=`</section>`;
  h+=`<section class="card"><div class="label">Backup</div><p class="empty">Your log lives in this browser. Export a copy now and then, and import it if you switch phones or clear your browser data.</p>
    <div class="backup"><button data-act="export">Export backup</button><label for="importFile">Import backup</label><input type="file" id="importFile" accept="application/json,.json" hidden></div></section>`;
  app.innerHTML=h;
}

function toast(msg){
  const host=document.getElementById("toastHost");
  host.innerHTML=`<div class="toast" role="status"><svg viewBox="0 0 24 24"><path d="M13.5 2s.7 3.2-1.6 6c-1.5 1.8-3.9 3.3-3.9 6.6A5.9 5.9 0 0 0 14 20.5a6.3 6.3 0 0 0 6-6.4c0-3.7-2.4-5.6-3.3-8.1-.3 1.6-1 2.7-2 3.3.4-3.4-1.2-6-1.2-7.3z"/></svg><span>${msg}</span></div>`;
  clearTimeout(toast.t);toast.t=setTimeout(()=>host.innerHTML="",3500);
}

/* ---------- events ---------- */
app.addEventListener("input",e=>{
  const el=e.target,k=state.date;
  if(el.id==="notes"){ensureLog(k).notes=el.value;save(k);return}
  if(el.dataset.f){
    const log=ensureLog(k),ex=el.dataset.ex,s=+el.dataset.s;
    log.sets[ex]=log.sets[ex]||[];while(log.sets[ex].length<=s)log.sets[ex].push({});
    log.sets[ex][s][el.dataset.f]=el.value;save(k);
  }
});
app.addEventListener("change",e=>{
  if(e.target.id==="importFile"){
    const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);const logs=d.logs||d;if(typeof logs!=="object")throw 0;
      let n=0;for(const k in logs){if(/^\d{4}-\d{2}-\d{2}$/.test(k)){state.logs[k]=logs[k];n++}}
      cacheLocal();render();toast(`Imported ${n} day${n===1?"":"s"}.`)}catch(err){toast("That file isn't a LiftLog backup.")}};
    rd.readAsText(f);return;
  }
  if(e.target.id==="pick"){const log=ensureLog(state.date),v=+e.target.value;log.session=v<0?null:v;save(state.date);render()}
});
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const k=state.date,act=b.dataset.act;
  if(act==="set"){
    const log=ensureLog(k),ex=b.dataset.ex,s=+b.dataset.s;
    log.sets[ex]=log.sets[ex]||[];while(log.sets[ex].length<=s)log.sets[ex].push({});
    const v=log.sets[ex][s];v.ok=!v.ok;
    if(v.ok){ // fill blanks from placeholders so a quick tap logs the planned set
      if((v.w==null||v.w==="")&&b.dataset.ph&&!isNaN(parseFloat(b.dataset.ph)))v.w=b.dataset.ph;
      if((v.r==null||v.r==="")){const m=String(b.dataset.rp).match(/\d+/g);if(m)v.r=m[m.length-1]}
    }
    save(k);render();return;
  }
  if(act==="after"){const log=ensureLog(k);log.after=!log.after;save(k);render();return}
  if(act==="habit"){const log=ensureLog(k);log.habits=log.habits||{};log.habits[b.dataset.id]=!log.habits[b.dataset.id];save(k);render();return}
  if(act==="feel"){const log=ensureLog(k),v=+b.dataset.v;log.feel=log.feel===v?null:v;save(k);render();return}
  if(act==="finish"){
    const log=ensureLog(k);log.done=!log.done;save(k);render();
    if(log.done){const n=currentStreak();window.scrollTo({top:0,behavior:"smooth"});
      toast(n>=2?`<b>${n}-day streak.</b> Keep it going.`:"Workout logged. That starts your streak.")}
    return;
  }
  if(act==="mprev"||act==="mnext"){let [y,m]=state.calMonth;m+=act==="mprev"?-1:1;if(m<0){m=11;y--}if(m>11){m=0;y++}state.calMonth=[y,m];render();return}
  if(act==="export"){
    const blob=new Blob([JSON.stringify({app:"liftlog",version:1,exported:new Date().toISOString(),logs:state.logs},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="liftlog-backup-"+todayKey()+".json";document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return;
  }
  if(act==="openday"){state.date=b.dataset.k;state.view="today";render();window.scrollTo(0,0);return}
});
document.getElementById("prevDay").onclick=()=>{state.date=addDays(state.date,-1);render()};
document.getElementById("nextDay").onclick=()=>{state.date=addDays(state.date,1);render()};
document.getElementById("tab-today").onclick=()=>{if(state.view==="today")state.date=todayKey();state.view="today";render();window.scrollTo(0,0)};
document.getElementById("tab-cal").onclick=()=>{state.view="cal";render();window.scrollTo(0,0)};
document.getElementById("tab-lifts").onclick=()=>{state.view="lifts";render();window.scrollTo(0,0)};
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const a=document.activeElement;if(!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")))render()}});

loadLocal();render();setSync("Saved on this phone. Use Backup on the Lifts tab to keep a copy.");
</script>
